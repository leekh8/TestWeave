# CI 프로파일 — 서버 없이 스캔만 실행하고 종료
spring.main.web-application-type=none
spring.main.banner-mode=off

# baseline 영속: 인메모리 대신 H2 파일 DB (CI에서는 actions/cache로 data/ 유지)
spring.datasource.url=jdbc:h2:file:./data/testweave
spring.h2.console.enabled=false

# 스캔 대상. targets.local.txt 가 있으면 그 파일이 이긴다(gitignore 대상).
# 여기 값은 파일이 없을 때의 기본값이다. 공개 저장소라 업무 대상은 파일에 둔다.
testweave.ci.targets=https://leekh8.github.io
testweave.ci.targets-file=targets.local.txt

# 사설 대역 점검 허용. 기본 false = 공개 인터넷 자산만 본다.
# 공개 CI에서는 절대 켜지 않는다. 자기 환경에서 손으로 켜는 스위치다.
testweave.allow-private=false
testweave.ci.check-types=HEADER,COOKIE,TLS
testweave.ci.report-dir=reports

# 브라우저 점검 흡수 (BROWSER 모듈).
#
# 🛑 위 check-types 에 BROWSER 를 **아직 넣지 않았다.** 넣으려면 그 전에
#    tools/browser-probe/probe.py 를 돌려 아래 파일을 만들어 두어야 한다.
#    순서를 바꾸면 첫 회차가 통째로 FAIL 이다 - 결과가 없는 것을 통과로
#    떨어뜨리지 않는 것이 그 모듈의 설계라서 그렇다.
#
# 상한이 24가 아니라 26인 이유: 매일 도는 스캔이 정확히 24시간 간격이 아니다.
# 러너 대기와 스케줄 지연으로 몇십 분씩 밀리는데 24로 두면 멀쩡한 회차가
# 「낡았다」로 떨어진다. 여유를 두되 이틀은 넘기지 않는다.
testweave.browser-findings-file=reports/browser-findings.json
testweave.browser-findings-max-hours=26
